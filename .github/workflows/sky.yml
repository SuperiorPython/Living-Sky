name: Render sky

on:
  schedule:
    # Runs at the top of every hour
    - cron: "0 * * * *"
  workflow_dispatch: {}

# Avoid two runs racing to commit/push at the same time
concurrency:
  group: sky-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate sky
        run: node scripts/generate.js

      - name: Generate solar system view
        run: node scripts/generate-solar-system.js

      - name: Commit and push
        run: |
          git config user.name "living-sky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sky.svg solar-system.svg README.md state/rotation.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update sky $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi